<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTUS 365 CRM</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:1100px;margin:auto;padding:28px"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><div style="color:var(--red);font-size:12px;font-weight:800">LOTUS 365</div><h1 style="margin:3px 0">Customer CRM</h1><p style="color:var(--muted)">Customers, credit limits, balances and payments.</p></div><a class="button" href="index.html">← Dashboard</a></div><div class="grid-2" style="margin-top:20px"><section class="card section"><h3>Add Customer</h3><form id="customerForm" class="form"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>GSTIN</label><input id="gstin"></div><div class="field"><label>Credit Limit</label><input id="creditLimit" type="number" min="0"></div><div class="field"><label>Opening Balance</label><input id="openingBalance" type="number"></div><div class="field full"><label>Address</label><input id="address"></div><div class="form-actions"><button class="primary">Save Customer</button></div></form></section><section class="card section"><h3>Record Payment</h3><form id="paymentForm" class="form"><div class="field full"><label>Customer</label><select id="customerId"></select></div><div class="field"><label>Amount</label><input id="amount" type="number" min="1" required></div><div class="field"><label>Mode</label><select id="mode"><option>Cash</option><option>Bank</option><option>UPI</option><option>Cheque</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Reference</label><input id="reference"></div><div class="form-actions"><button class="primary">Save Payment</button></div></form></section></div><section class="card section" style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Customer Ledger</h3><input id="search" placeholder="Search customer..." style="max-width:250px"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Credit Limit</th><th>Outstanding</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="msg" style="margin-top:12px;color:var(--green);font-size:13px"></div></main><script src="crm.js"></script><script>function render(){const q=search.value.toLowerCase();const d=lotusCRM.load();customerId.innerHTML=d.customers.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');rows.innerHTML=d.customers.filter(c=>c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)).map(c=>{const b=lotusCRM.balance(c.id);return '<tr><td>'+c.id+'</td><td><b>'+c.name+'</b></td><td>'+c.phone+'</td><td>₹'+c.creditLimit.toLocaleString('en-IN')+'</td><td>₹'+b.toLocaleString('en-IN')+'</td><td><span class="badge">'+(b>c.creditLimit&&c.creditLimit>0?'Over Limit':'Active')+'</span></td></tr>'}).join('')}customerForm.onsubmit=e=>{e.preventDefault();lotusCRM.addCustomer({name:name.value,phone:phone.value,email:email.value,gstin:gstin.value,creditLimit:creditLimit.value,openingBalance:openingBalance.value,address:address.value});e.target.reset();msg.textContent="Customer saved successfully.";render()};paymentForm.onsubmit=e=>{e.preventDefault();lotusCRM.addPayment({customerId:customerId.value,amount:amount.value,mode:mode.value,date:date.value,reference:reference.value});e.target.reset();msg.textContent="Payment recorded successfully.";render()};search.oninput=render;date.value=new Date().toISOString().slice(0,10);render()</script></body></html>
