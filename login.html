<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTUS 365 — Sign in</title><link rel="stylesheet" href="style.css"></head><body><div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f7f5f2,#ead9d9)"><div class="card section" style="width:min(420px,100%);padding:30px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:24px"><div class="logo" style="background:var(--red);color:#fff">L</div><div><b style="font-size:18px">LOTUS 365</b><div style="font-size:11px;color:var(--muted)">Business ERP</div></div></div><h2 style="margin:0 0 6px">Welcome back</h2><p style="color:var(--muted);font-size:12px;margin-bottom:22px">Sign in to your business workspace.</p><form id="login" class="form" style="padding:0"><div class="field full"><label>Email</label><input id="email" type="email" value="admin@lotus365.local" required></div><div class="field full"><label>Password</label><input id="password" type="password" value="lotus365" required></div><div id="err" class="danger" style="grid-column:1/-1;font-size:12px"></div><div class="form-actions"><button class="primary">Sign in</button></div></form><p style="font-size:10px;color:var(--muted);margin-top:20px">Phase 2 local foundation • Admin demo credential: lotus365</p></div></div><script src="phase2-core.js"></script><script>document.getElementById("login").onsubmit=e=>{e.preventDefault();const r=lotusCore.login(email.value,password.value);if(r.ok)location.href="index.html";else err.textContent=r.message}</script></body></html>
